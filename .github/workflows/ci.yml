name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-test-pack:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Checkout locked M1 Zhinu source
        uses: actions/checkout@v6
        with:
          repository: jenolaszlo-sketch/penghou-zhinu
          ref: 07e1807cc4b867dd4f527445aa108f56135d37db
          path: .aaaw-source/zhinu

      - name: Checkout locked M1 Qingniao source
        uses: actions/checkout@v6
        with:
          repository: jenolaszlo-sketch/penghou-qingniao
          ref: f08971df33916be184fd1bebb5940ba2bd660a49
          path: .aaaw-source/qingniao

      - name: Build unpublished M1 packages
        shell: pwsh
        run: ./eng/qualify-aaaw-m1.ps1 -PackagesOnly -ZhinuCheckout .aaaw-source/zhinu -QingniaoCheckout .aaaw-source/qingniao

      - name: Restore package consumer
        run: dotnet restore Marang.slnx --configfile NuGet.AAAWM1.Config

      - name: Build
        run: dotnet build Marang.slnx --configuration Release --no-restore

      - name: Verify formatting
        run: dotnet format Marang.slnx --verify-no-changes --no-restore

      - name: Test
        run: dotnet test Marang.slnx --configuration Release --no-build

      - name: Pack
        run: dotnet pack Marang.slnx --configuration Release --no-build --output artifacts --property:PackageVersion=0.0.0-ci.${{ github.run_id }}

      - name: Upload packages
        uses: actions/upload-artifact@v6
        with:
          name: nuget-packages
          path: |
            artifacts/*.nupkg
            artifacts/*.snupkg
          if-no-files-found: error

      - name: Upload M1 qualification evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: aaaw-m1-evidence
          path: artifacts/aaaw-m1/
          if-no-files-found: warn

      - name: Upload M2 qualification evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: aaaw-m2-evidence
          path: artifacts/aaaw-m2/
          if-no-files-found: warn

      - name: Upload M3 qualification evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: aaaw-m3-evidence
          path: artifacts/aaaw-m3/
          if-no-files-found: warn

      - name: Upload M4 qualification evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: aaaw-m4-evidence
          path: artifacts/aaaw-m4/
          if-no-files-found: warn

  ui:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/Marang.Ui
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.19.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24.x
          cache: pnpm
          cache-dependency-path: src/Marang.Ui/pnpm-lock.yaml

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build
