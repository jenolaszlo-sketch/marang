name: AAAW M6.2 native macOS qualification

on:
  push:
    branches: [codex/aaaw-m6-2-compatibility]
    paths:
      - '.editorconfig'
      - '.github/workflows/aaaw-m6-2-macos.yml'
      - 'eng/**'
      - 'src/**'
      - 'tests/**'
      - 'Directory.Build.*'
      - 'NuGet.AAAWM1.Config'
      - 'Marang.slnx'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-macos:
    runs-on: macos-15
    timeout-minutes: 90
    env:
      UseSharedCompilation: 'false'
      MSBUILDDISABLENODEREUSE: '1'
      DOTNET_CLI_DO_NOT_USE_MSBUILD_SERVER: '1'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1
        with:
          dotnet-version: |
            8.0.426
            10.0.401
      - name: Use physical task temporary directory
        shell: bash
        run: |
          test "$(uname -m)" = arm64
          physical_temp="$(cd "$RUNNER_TEMP" && pwd -P)/aaaw-m6-2"
          mkdir -p "$physical_temp"
          echo "TMPDIR=$physical_temp/" >> "$GITHUB_ENV"
      - name: Build exact M6.1 old writer, run unchanged M6.1 qualification, and verify M6.2
        run: python3 eng/qualify-aaaw-m6-2.py
      - name: Upload sealed M6.2 and original M6.1/M5 evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: aaaw-m6-2-macos-${{ github.sha }}
          path: |
            artifacts/aaaw-m6-2/macos-qualification/qualification.json
            artifacts/aaaw-m6-2/macos-qualification/captured-artifacts.zip
            artifacts/aaaw-m6-1/macos-qualification/qualification.json
            artifacts/aaaw-m6-1/macos-qualification/captured-artifacts.zip
            artifacts/aaaw-m5/macos-qualification/qualification.json
            artifacts/aaaw-m5/macos-qualification/*.trx
            artifacts/aaaw-m5/macos-qualification/captured-artifacts.zip
          if-no-files-found: error
          retention-days: 30
